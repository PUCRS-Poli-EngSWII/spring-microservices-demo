# Versão para https, execução em um único processo
#    containerizado com docker. Cada microserviço tem sua
#    porta definida no arquivo application.properties.
server.port=8081
server.servlet.context-path=/api

# DataSource Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:postgresql://banco:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=mysecretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Application Name
spring.application.name=course-service

